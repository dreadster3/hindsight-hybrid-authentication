# Release automation, end to end, in ONE workflow.
#
# Two jobs, `needs:`-chained inside a single run: open the release PR, and — in the same run that
# tags it — push the image. The chaining is what lets the default `GITHUB_TOKEN` do the whole job
# (see TOKEN below), and it is why there is no workflow triggered by the `release: released`
# event.
#
# WHAT RUNS WHEN
#   push to main, alone:
#     job `release-please` opens or refreshes a PR titled "chore(main): release X.Y.Z". Nothing is
#     built and no tag exists yet. Merging ordinary work is unaffected; the PR just sits there.
#   the OWNER merges that release PR:
#     the same run's `release-please` job tags `vX.Y.Z` and creates the GitHub Release, then
#     reports `release_created=true`, so the `docker` job runs in that same run and pushes the
#     image to GHCR.
#   workflow_dispatch:
#     a manual run. release-please no-ops when nothing is pending, so `docker` is skipped by its
#     `if:`. That makes this a manual re-check, NOT a re-publish path: on a fresh dispatch there
#     is nothing pending, hence no new tag for the job to check out. To retry a FAILED push, use
#     "Re-run failed jobs" on the run that created the release (Actions -> that run); re-runs
#     reuse the original commit and ref.
#
# CONVENTIONAL COMMITS — and because this repo squash-merges, the PR TITLE is the commit subject.
# release-please builds the changelog and the version bump from CONVENTIONAL COMMITS ONLY
# (`feat:`, `fix:`, `perf:`, ...). A PR titled "add oauth cache" therefore produces no changelog
# entry and no bump; "feat: add oauth cache" does. Get the PR titles right, not the commits
# inside them.
#
# WHAT PUBLISHES, AND WHY THERE IS NO PyPI JOB
#   The image is the distribution artifact — the extension only ever runs inside the Hindsight
#   server, which is the thing the Dockerfile bakes it into, so there is no sdist/wheel to upload
#   and no PyPI pending-publisher to register. The owner controls WHEN a release happens: nothing
#   is built or tagged until the release PR is merged, and that merge is the whole release
#   decision. A GHCR push, like any registry publish, is final — a bad image must be superseded by
#   a new tag, never replaced.
#
# TOKEN — default `GITHUB_TOKEN`, no PAT and no long-lived token of any kind.
#   A workflow that fired on the `release: released` event would be suppressed when `GITHUB_TOKEN`
#   itself created that release, which is the classic cause of "the release is tagged but nothing
#   gets published". That gap does not exist here: the push is `needs:`-chained within the run that
#   creates the tag, and `needs:` chaining is not event-based, so nothing has to be triggered and
#   there is no fine-grained PAT to leak or rotate. The default token is still scoped per job by
#   the `permissions:` blocks below.
#
# ---------------------------------------------------------------------------------------
# OPERATOR SETUP — one optional step, external to this repo.
#
#   GHCR visibility (optional). The package is private on first push. Make it public under
#     https://github.com/users/dreadster3/packages/container/hindsight-hybrid-authentication/settings
#   if the image should be pullable without auth. Nothing else is needed: `packages: write` on the
#   `docker` job below is all the authorisation the GHCR push requires, and the image name is the
#   repository's, so no registry-side pre-registration exists.
# ---------------------------------------------------------------------------------------

name: Release

"on":
  push:
    branches: [main]
  workflow_dispatch:

# Workflow-level default is the narrowest that works; every job re-declares what it needs, so the
# `contents: write` granted to release-please can never leak into the image push.
permissions:
  contents: read

jobs:
  release-please:
    name: Tag and release
    runs-on: ubuntu-latest

    # Only what release-please writes: the release PR, the tag and the Release.
    permissions:
      contents: write
      pull-requests: write

    # Never cancels: two overlapping runs could both try to open a release PR, and serialising is
    # what makes the release PR deterministic. Job-scoped rather than workflow-scoped so a run that
    # is pushing an image cannot be delayed by the next push to main. The `docker` job needs no
    # group of its own — release-please is serialised, so at most one run at a time reports
    # `release_created=true`, and a duplicate tag is rejected by GitHub itself as the backstop.
    concurrency:
      group: release-please
      cancel-in-progress: false

    outputs:
      # `release_created` is the gate for the `docker` job; `tag_name` (`vX.Y.Z`) is what it checks
      # out and what the image is tagged from. Both are strings, so `if:` compares to 'true'.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      # v5, not v4: v4 is `runs.using: node20` and Node 20 was removed from the hosted runners, so
      # v4 no longer starts. Every pin in this file is a node24 build for the same reason
      # (checkout@v7, metadata-action@v6 rather than v5).
      # Manifest mode. The release strategy and the tag shape live in the repo-root config file,
      # not on this step: `release-please-config.json` declares the single package "." with
      # `release-type: python`, `include-component-in-tag: false` (tag = plain `vX.Y.Z`, no
      # component prefix) and `include-v-in-tag: true`. `.release-please-manifest.json` tracks the
      # released version per package and is seeded `0.0.0` — release-please's "never released"
      # SENTINEL, which is exactly right here: no tag or Release exists yet. Do not "fix" it to the
      # current version: a real version in the manifest backfills it as last-released-at-unknown-sha,
      # so every commit counts from the beginning of history and the first release jumps past the
      # intended one. With the sentinel, `Python.initialReleaseVersion()` (0.1.0) gives this repo
      # its intended first release, 0.1.0 — verified against the action's sources, and it is also
      # the value release-please's own bootstrapper seeds (`initialVersionString = '0.0.0'`).
      # release-please rewrites the file with the real version inside each release PR.
      #
      # No `release-type` input here on purpose — one source of truth. The action falls through to
      # `Manifest.fromManifest(...)` only when `release-type` is EMPTY, so passing it inline would
      # silently ignore both config files.
      #
      # The `python` strategy reads the root `pyproject.toml`'s `[project] version` — static here,
      # so it is bumped in place. It also *tries* to rewrite `__version__ = "..."` in
      # `<name>/__init__.py` and `src/<name>/__init__.py`. Our package lives at
      # `src/hindsight_ext_hybrid_tenant/__init__.py` and the distribution name is
      # `hindsight-ext-hybrid-tenant`, so none of the derived paths match: it logs a "file did not
      # exist" warning and moves on. Harmless, nothing to fix.
      #
      # The config's `extra-files` rewrites the project's own version inside `uv.lock` in the same
      # release PR. Without it the lock would still say the old version after the bump and the
      # `lock-check` CI job would fail on the release commit.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    name: Build and push image to GHCR
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # The tag release-please just created, so the image is built from the released commit and not
      # from whatever main has moved on to. No `fetch-depth`: nothing here reads git history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Sets up BuildKit, which `docker/build-push-action` needs for the cache configuration below
      # to take effect.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is sufficient for GHCR; `packages: write` above is what authorises it.
          password: ${{ secrets.GITHUB_TOKEN }}

      # This trigger is a push, not a tag push, so metadata-action's usual `type=semver` auto-
      # detection has no `refs/tags/...` to read and would emit nothing. All three tag lines therefore
      # pass the release tag in explicitly through `value=`, taken straight from the release-please
      # output — no version string is re-derived from git, so nothing can silently normalize a tag
      # into a different one. Expected tags for a release tag v0.3.0: v0.3.0, v0.3, v0, latest.
      # `latest` comes from the action itself: for a non-prerelease, semver emits it (flavour
      # `latest=auto`), so it is deliberately not written out as a raw tag — that also keeps a
      # prerelease from moving `latest`. If `tag_name` were ever empty, the lines below match
      # nothing and the build fails on an empty tag list rather than pushing a mislabelled image;
      # the `if:` on this job is what makes that unreachable in practice.
      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/dreadster3/hindsight-hybrid-authentication
          tags: |
            type=semver,pattern=v{{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern=v{{major}},value=${{ needs.release-please.outputs.tag_name }}

      # Context is the repo ROOT, not deploy/: the Dockerfile COPYs src/ into /app/extensions, and
      # a narrower context would break that copy. linux/amd64 only — the same platform the deploy
      # target runs, and an arm64 leg would double release time for an image nobody pulls on arm.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # GHA cache keeps the base-image pull and the uv pip layer warm between releases;
          # `ignore-error` so a cache outage cannot fail an otherwise good release.
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
