[project]
name = "hindsight-ext-hybrid-tenant"
version = "0.1.0"
description = "Hybrid Hindsight TenantExtension: static API keys (OAuth2/OIDC lane in a stacked PR), each mapping to an isolated per-user PostgreSQL schema."
readme = "README.md"
authors = [
    { name = "dreadster3", email = "afonso.antunes@live.com.pt" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hindsight_ext_hybrid_tenant"
