[project]
name = "hindsight-ext-hybrid-tenant"
version = "1.1.0"
description = "Hindsight TenantExtension: static API keys and OAuth2/OIDC bearer tokens, each mapping to an isolated per-user PostgreSQL schema."
readme = "README.md"
authors = [
    { name = "dreadster3", email = "afonso.antunes@live.com.pt" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hindsight_ext_hybrid_tenant"

# Boring on purpose: ruff's own default rule set plus `ruff format` as the single
# formatter, so `ruff check` flags mistakes rather than style opinions. line-length
# 100 is the one setting that matters here — the source wraps its prose docstrings
# at 100 and 88 would reflow blocks that were written to read well.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Two rules are off, both because their fix would change behaviour rather than
# formatting:
#   TRY004 — the JWKS fetch path raises ValueError for a non-object payload on
#     purpose; that type is caught and translated to AuthenticationError one call
#     up, so switching it to TypeError would change what callers (and tests) see.
#   BLE001 — the blind `except Exception` around the host-supplied
#     `run_migration` is the point: any failure has to become AuthenticationError
#     instead of escaping as a raw traceback mid-authentication.
ignore = ["TRY004", "BLE001"]
